# =========================================================================
# ~/.config/hypr/hyprpaper.conf (Modern Block Style)
# =========================================================================

# 📥 PRELOAD CACHE BLOCK
preload = ~/Pictures/Wallpapers/cyber_vertical.jpg
preload = ~/Pictures/Wallpapers/cyber_centre.jpg
preload = ~/Pictures/Wallpapers/cyber_4k.jpg

# 🎯 INDIVIDUAL TARGET MONITOR BLOCKS
wallpaper {
    monitor = DP-3
    path = ~/Pictures/Wallpapers/cyber_vertical.jpg
}

wallpaper {
    monitor = DP-2
    path = ~/Pictures/Wallpapers/cyber_centre.jpg
}

wallpaper {
    monitor = DP-4
    path = ~/Pictures/Wallpapers/cyber_4k.jpg
}

# ⚙️ SYSTEM OPTIMIZATIONS
splash = false
ipc = true

