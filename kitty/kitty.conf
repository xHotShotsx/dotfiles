# =========================================================================
# ~/.config/kitty/kitty.conf
# =========================================================================

# 🧼 WINDOW TRANSPARENCY
# 0.0 is completely invisible, 1.0 is completely solid.
# 0.85 gives a beautiful, sleek translucent view of your cyberpunk background!
background_opacity 0.85

# 🌪️ DYNAMIC DIMS (Optional)
# Dim the transparency slightly when you switch focus away from a terminal tab
inactive_text_alpha 0.8
